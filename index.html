<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVAIQ | القوالب البرمجية والمواقع الإلكترونية الذكية للشركات</title>
    <link rel="icon" type="image/png" href="/src/assets/images/novaiq-icon.png" />
    <!-- Cairo & Tajawal are self-hosted (see src/index.css @font-face rules) instead of
         loaded from Google Fonts, to avoid the extra third-party round-trip and the
         visible font swap-in delay that came with it. -->
    <!-- Preloaded so the browser starts fetching the font bytes immediately, in parallel
         with everything else, instead of only discovering it needs them after parsing the
         CSS — combined with font-display:block below, this is what actually prevents the
         page from ever painting in a fallback font first. Both subsets matter even in
         Arabic mode: the NOVAIQ wordmark itself is Latin script. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cairo-variable-arabic.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cairo-variable-latin.woff2" crossorigin>

    <!-- Boot progress bar. Deliberately inlined here rather than living in a component or in
         index.css: its whole job is to be on screen during the window where neither the CSS
         bundle nor the JS bundle has arrived yet, and anything loaded from a separate file
         would show up only after the wait it is meant to cover. It is markup and styles the
         parser can paint on the very first chunk of the document.

         The fill runs on a decelerating keyframe that eases toward ~90% and holds there —
         it never claims to be finished on its own, because it has no way of knowing. main.tsx
         adds `.is-done` once React has actually mounted, which snaps it to 100% and fades it
         out. The sheen sweeping across it is a second layer, so the movement reads even
         while the fill is sitting at its plateau on a slow connection. -->
    <style>
      #boot-progress {
        position: fixed;
        inset-inline: 0;
        top: 0;
        height: 3px;
        z-index: 2147483647;
        pointer-events: none;
        opacity: 1;
        transition: opacity 400ms ease 120ms;
      }
      #boot-progress-fill {
        position: relative;
        height: 100%;
        width: 0;
        overflow: hidden;
        border-radius: 0 2px 2px 0;
        background: #ffffff;
        /* White core, silver bloom — the grey outer halo is what stops a 3px white line from
           reading as a hairline border against the near-black page. */
        box-shadow:
          0 0 8px 0 rgba(255, 255, 255, 0.85),
          0 0 20px 2px rgba(161, 161, 170, 0.55),
          0 0 42px 6px rgba(113, 113, 122, 0.35);
        animation: boot-progress-grow 14s cubic-bezier(0.12, 0.78, 0.2, 1) forwards;
      }
      #boot-progress-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
        animation: boot-progress-sheen 1.15s ease-in-out infinite;
      }
      @keyframes boot-progress-grow {
        0%   { width: 0; }
        22%  { width: 42%; }
        55%  { width: 70%; }
        100% { width: 90%; }
      }
      @keyframes boot-progress-sheen {
        from { transform: translateX(-100%); }
        to   { transform: translateX(100%); }
      }
      #boot-progress.is-done {
        opacity: 0;
      }
      #boot-progress.is-done #boot-progress-fill {
        width: 100%;
        animation: none;
        transition: width 220ms ease-out;
      }
      #boot-progress.is-done #boot-progress-fill::after {
        animation: none;
      }
      /* The bar still fills and still disappears — only the looping sheen is dropped, since
         that is the part that is pure decoration. */
      @media (prefers-reduced-motion: reduce) {
        #boot-progress-fill::after { animation: none; }
      }
    </style>
  </head>
  <body class="bg-[#030712] text-slate-100 font-['Cairo',sans-serif] antialiased selection:bg-purple-600 selection:text-white min-h-screen overflow-x-hidden">
    <div id="boot-progress" role="presentation" aria-hidden="true"><div id="boot-progress-fill"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
