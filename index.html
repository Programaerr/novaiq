<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NUVAIQ</title>
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <!-- Installable-app (PWA) wiring: the manifest makes Android/Chrome offer "Add to home
         screen", and the iOS metas make "Add to Home Screen" work on iPhone Safari too. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Matches the page's own background exactly (--nq-ground in src/index.css). Android/Chrome
         paints its address bar with this, so a value even slightly off shows as a seam between
         the browser chrome and the top of the site. Warm White, not black — the brand's flat page
         background is a light neutral; #000000 here would flash a dark bar above a light page on
         first paint. -->
    <meta name="theme-color" content="#F7F7F5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` gives dark status-bar icons/clock, for the light warm-white page underneath
         them. `black-translucent` (light icons over transparent) was right for the site's
         earlier black ground and would be unreadable on this one. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NUVAIQ" />
    <!-- Social preview, regenerated for this identity: an Obsidian ground, a subtle technical
         grid, and a sparse scatter of Orange connection nodes with thin data-path lines — the
         brief's own mental image for the hero visual ("شبكة تقنية مظلمة دقيقة جدًا تحتوي على نقاط
         اتصال برتقالية مهمة"), reused here rather than invented twice. A handful of nodes, not a
         field of them, and no wash of colour anywhere — Orange stays the rare signal even in a
         static image. Generated as a real 1200×630 PNG (og-image.png in public/), not left as an
         SVG, since several scrapers (Twitter/X among them) do not reliably render SVG previews. -->
    <meta property="og:title" content="NUVAIQ" />
    <meta property="og:description" content="Enterprise-grade software, applications, and AI systems — engineered, not templated." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NUVAIQ" />
    <meta name="twitter:description" content="Enterprise-grade software, applications, and AI systems — engineered, not templated." />
    <meta name="twitter:image" content="/og-image.png" />
    <!-- Cairo & Tajawal are self-hosted (see src/index.css @font-face rules) instead of
         loaded from Google Fonts, to avoid the extra third-party round-trip and the
         visible font swap-in delay that came with it. -->
    <!-- Preloaded so the browser starts fetching the font bytes immediately, in parallel
         with everything else, instead of only discovering it needs them after parsing the
         CSS — combined with font-display:block below, this is what actually prevents the
         page from ever painting in a fallback font first. Both subsets matter even in
         Arabic mode: the NUVAIQ wordmark itself is Latin script. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cairo-variable-arabic.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cairo-variable-latin.woff2" crossorigin>
  </head>
  <!-- Background, text colour, font and overflow are NOT set here. They live in one place —
       the `body` rule in @layer base (src/index.css) — and the utilities that used to be on this
       tag were silently beating it: a Tailwind utility outranks the base layer, so the page was
       #030712 while the stylesheet that looks authoritative said #000000, and every future edit
       to that rule would have done nothing. #030712 is also blue-tinted, which is the one thing
       this palette is not: the site is strictly monochrome, and a blue-black base put a cast
       under every grey on the page.

       What is left here is what genuinely belongs to the document rather than to the design:
       font smoothing, the selection colours (matched to the app shell's own, replacing a purple
       that was the only saturated colour anywhere on the site), and a minimum height. -->
  <body class="antialiased selection:bg-zinc-100 selection:text-black min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
